<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>پنل کاربری | Pixel Shop</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        .panel {
            width: 90%;
            max-width: 500px;
            margin: 80px auto;
            padding: 30px;
            background: #1c1c1c;
            border-radius: 15px;
        }

        h1 {
            color: red;
        }

        .box {
            background: #292929;
            padding: 15px;
            margin: 15px 0;
            border-radius: 10px;
        }

        .back {
            display: inline-block;
            background: red;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 8px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="panel">

        <h1>👤 پنل کاربری</h1>

        <div class="box">
            👋 خوش آمدید!
        </div>

        <div class="box">
            📦 سفارش‌های من
        </div>

        <div class="box">
            💰 موجودی حساب
        </div>

        <div class="box">
            ⚙️ تنظیمات حساب
        </div>

        <a href="index.html" class="back">
            بازگشت به فروشگاه
        </a>

    </div>

</body>

</html>
